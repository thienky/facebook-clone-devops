name: CD Production

on:
  push:
    branches: [main]

env:
  SSH_SERVER: ${{ secrets.SSH_USER }}@${{ secrets.IP_SERVER_RUN }}
  COMPOSE_FILE_DIR: /home/ubuntu/facebook-clone-core
  APP_DIR: facebook-clone-core
  FE_DIR: facebook-clone-fe
  API_IMAGE: facebook_clone_api_image:latest
  FE_IMAGE: facebook_clone_fe_image:latest
  API_SERVICE: facebook_clone_api
  FE_SERVICE: facebook_clone_fe

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts
      - run: |
          test -f $APP_DIR/Dockerfile
          test -f $FE_DIR/Dockerfile
      - run: |
          ssh $SSH_SERVER "
            set -e
            test -f $COMPOSE_FILE_DIR/$APP_DIR/.env.production
            test -f $COMPOSE_FILE_DIR/docker-compose.yml
          "

  build:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts
      - run: docker build -t $API_IMAGE -f $APP_DIR/Dockerfile --target runtime $APP_DIR
      - run: |
          docker build -t $FE_IMAGE -f $FE_DIR/Dockerfile \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            $FE_DIR
      - run: |
          docker save $API_IMAGE | gzip | ssh $SSH_SERVER "gunzip | docker load"
          docker save $FE_IMAGE | gzip | ssh $SSH_SERVER "gunzip | docker load"

  deploy:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts
      - run: |
          ssh $SSH_SERVER "
            set -e
            cd $COMPOSE_FILE_DIR
            docker compose up -d --force-recreate $API_SERVICE $FE_SERVICE prometheus grafana
            docker image prune -f
          "
