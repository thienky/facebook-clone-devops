name: Deploy Docker Hub

on:
  workflow_dispatch:

env:
  SSH_SERVER: ${{ secrets.SSH_USER }}@${{ secrets.IP_SERVER_RUN }}
  COMPOSE_FILE_DIR: /home/ubuntu/facebook-clone-core
  APP_DIR: facebook-clone-core
  FE_DIR: facebook-clone-fe
  API_IMAGE: ${{ secrets.DOCKER_USER }}/facebook_clone_api_image:latest
  FE_IMAGE: ${{ secrets.DOCKER_USER }}/facebook_clone_fe_image:latest
  API_SERVICE: facebook_clone_api
  FE_SERVICE: facebook_clone_fe

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t $API_IMAGE -f $APP_DIR/Dockerfile --target runtime $APP_DIR
      - run: |
          docker build -t $FE_IMAGE -f $FE_DIR/Dockerfile \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            $FE_DIR
      - run: echo "${{ secrets.DOCKER_PASS }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
      - run: |
          docker push $API_IMAGE
          docker push $FE_IMAGE

  deploy:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}
      - run: ssh-keyscan -H ${{ secrets.IP_SERVER_RUN }} >> ~/.ssh/known_hosts
      - run: |
          ssh $SSH_SERVER "
            set -e
            cd $COMPOSE_FILE_DIR
            docker compose pull $API_SERVICE $FE_SERVICE
            docker compose up -d --force-recreate $API_SERVICE $FE_SERVICE
            docker image prune -f
          "
