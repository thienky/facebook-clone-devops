global:
  scrape_interval: 1m
  evaluation_interval: 1m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
