- name: Install Nginx reverse proxy
  hosts: myhosts
  become: true

  tasks:
      - name: Install Nginx
        ansible.builtin.apt:
            name: nginx
            state: present
            update_cache: true

      - name: Deploy site config
        ansible.builtin.template:
            src: templates/facebook-clone.nginx.conf.j2
            dest: /etc/nginx/sites-available/facebook-clone
            mode: "0644"

      - name: Enable site
        ansible.builtin.file:
            src: /etc/nginx/sites-available/facebook-clone
            dest: /etc/nginx/sites-enabled/facebook-clone
            state: link
            force: true

      - name: Remove default site
        ansible.builtin.file:
            path: /etc/nginx/sites-enabled/default
            state: absent

      - name: Reload Nginx
        ansible.builtin.service:
            name: nginx
            state: reloaded
